<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Умный VPN нового поколения">

  <!--
    viewport-fit=cover — чтобы страница занимала экран целиком, вместе с
    областями под вырезом и жестовой полосой. Без него iOS оставляет по краям
    белые поля, и приложение сразу видно как «сайт в рамке».

    Безопасные отступы после этого не пропадают: Flutter получает их из
    системы и сам не заводит содержимое под Dynamic Island.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Запуск с домашнего экрана: без адресной строки и кнопок Safari. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Строка состояния прозрачная: тёмный фон приложения уходит под неё. -->
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Various VPN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>various_vpn</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Свой bootstrap вместо стандартного flutter_bootstrap.js.

    Причина одна: по умолчанию Flutter грузит движок отрисовки (CanvasKit) с
    gstatic.com, хотя тот же файл лежит рядом в сборке. Там, где gstatic
    недоступен — а это как раз наши пользователи, — страница остаётсябелой
    навсегда: каркас смонтирован, рисовать нечем. canvasKitBaseUrl заставляет
    брать движок из собственной папки, и внешняя сеть не нужна вовсе.
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: { canvasKitBaseUrl: 'canvaskit/' }
    });
  </script>
</body>
</html>
